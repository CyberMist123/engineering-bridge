name: Apply target-clean test fix

on:
  push:
    branches:
      - fix/controlled-patch-target-clean
    paths:
      - .github/workflows/diagnose-target-clean.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlled-patch-target-clean
          fetch-depth: 0
      - name: Update obsolete concurrent APPLY expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/unit/tasks/controlled-patch-service.test.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    assert.equal(secondEnteredBeforeRelease, false);
              assert.equal(results.filter(({ status }) => status === "fulfilled").length, 1);
              assert.equal(results.filter(({ status }) => status === "rejected").length, 1);
              assert.equal(
                (results.find(({ status }) => status === "rejected") as PromiseRejectedResult).reason.code,
                "WORKSPACE_PRECONDITION_FAILED"
              );
              assert.equal(readFileSync(join(root, "note.txt"), "utf8"), "after\\n");
              assert.equal(readFileSync(join(root, "second.txt"), "utf8"), "before\\n");'''
          new = '''    assert.equal(secondEnteredBeforeRelease, false);
              assert.equal(results.filter(({ status }) => status === "fulfilled").length, 2);
              assert.equal(results.filter(({ status }) => status === "rejected").length, 0);
              assert.equal(readFileSync(join(root, "note.txt"), "utf8"), "after\\n");
              assert.equal(readFileSync(join(root, "second.txt"), "utf8"), "after\\n");'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete assertion block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/tasks/controlled-patch-service.test.ts
          git rm .github/workflows/diagnose-target-clean.yml
          git commit -m "test: align concurrent APPLY with target-scoped cleanliness"
          git push origin HEAD:fix/controlled-patch-target-clean
