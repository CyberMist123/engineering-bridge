name: Diagnose target-clean CI

on:
  push:
    branches:
      - fix/controlled-patch-target-clean
    paths:
      - .github/workflows/diagnose-target-clean.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlled-patch-target-clean
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests and retain failure excerpt
        shell: bash
        run: |
          set +e
          npm test > /tmp/target-clean-test.log 2>&1
          status=$?
          {
            echo "exit_status=$status"
            echo "--- matching failure lines ---"
            grep -n -E -C 8 'not ok|AssertionError|ERR_ASSERTION|failureType|WORKSPACE_PRECONDITION_FAILED|test failed|tests? failed' /tmp/target-clean-test.log || true
            echo "--- tail ---"
            tail -n 300 /tmp/target-clean-test.log
          } > ci-target-clean.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-target-clean.log
          git commit -m "chore: capture target-clean CI failure"
          git push origin HEAD:fix/controlled-patch-target-clean
          exit "$status"
