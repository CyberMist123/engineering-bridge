name: Patch target-clean test contract

on:
  push:
    branches:
      - fix/controlled-patch-target-clean
    paths:
      - .github/workflows/patch-target-clean-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/controlled-patch-target-clean
          fetch-depth: 0
      - name: Update obsolete dirty-workspace expectation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/tasks/controlled-patch-service.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '''test("rejects dirty workspaces, changed HEAD, and malformed or out-of-scope patches", async () => {
            const dirtyRoot = repository();
            writeFileSync(join(dirtyRoot, "note.txt"), "dirty\\n");
            const dirty = fixture(dirtyRoot, async () => ({ kind: "completed", output: validPatch })).controlled;
            await expectCode(() => dirty.generate({ workspace_id: "workspace", change_request: "change" }), "WORKSPACE_PRECONDITION_FAILED");

            for (const output of ["```diff\\n" + validPatch + "```", validPatch.replaceAll("note.txt", "new.txt")]) {
          '''
          new = '''test("rejects dirty targets, changed HEAD, and malformed or out-of-scope patches", async () => {
            const dirtyRoot = repository();
            writeFileSync(join(dirtyRoot, "note.txt"), "dirty\\n");
            const { controlled: dirty, tasks: dirtyTasks } = fixture(
              dirtyRoot,
              async () => ({ kind: "completed", output: validPatch })
            );
            const dirtyGenerated = await dirty.generate({ workspace_id: "workspace", change_request: "change" });
            await terminal(dirtyTasks, dirtyGenerated.taskId);
            await expectCode(
              () => dirty.apply({ patch_task_id: dirtyGenerated.taskId, confirmation: "APPLY" }),
              "WORKSPACE_PRECONDITION_FAILED"
            );

            for (const output of ["```diff\\n" + validPatch + "```", validPatch.replaceAll("note.txt", "new.txt")]) {
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one obsolete block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git diff --check
          git diff -- tests/unit/tasks/controlled-patch-service.test.ts
      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/tasks/controlled-patch-service.test.ts
          git commit -m "test: update dirty-target lifecycle expectation"
          git push origin HEAD:fix/controlled-patch-target-clean
